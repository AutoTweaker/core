name: Release

on:
  push:
    tags: [ 'v*' ]

env:
  AUTOTWEAKER_RELEASE: "1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      full-version: ${{ steps.version.outputs.full-version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract version from tag
        run: |
          VERSION="${{ github.ref_name }}"
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Build and package
        run: ./gradlew :autotweaker-core:distZip :autotweaker-core:distTar

      - name: Export full version
        id: version
        run: |
          ./gradlew -q :exportVersion
          echo "full-version=$(cat build/generated/versioning/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Build .deb package
        run: ./gradlew buildDeb

      - name: Publish to Maven Central
        run: ./gradlew publishAggregationToCentralPortal
        env:
          ORG_GRADLE_PROJECT_centralPortalUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_centralPortalPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

      - name: Create GitHub Release
        run: |
          gh release create "v$VERSION" \
            --title "AutoTweaker v$VERSION" \
            --generate-notes \
            core/build/distributions/*.zip \
            core/build/distributions/*.tar \
            .temp/deb/*.deb
        env:
          GH_TOKEN: ${{ github.token }}

  update-index:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        run: |
          VERSION="${{ github.ref_name }}"
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Install PyYAML
        run: pip3 install pyyaml

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WEBSITE_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Clone index repository
        run: git clone git@github.com:AutoTweaker/index.git .temp/index
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/deploy_key

      - name: Configure git
        working-directory: .temp/index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge release assets into index
        working-directory: .temp/index
        run: |
          gh release view "v${VERSION}" --repo AutoTweaker/core --json assets \
            | python3 ../../scripts/merge-index.py ../../index.yml index.json "${{ needs.release.outputs.full-version }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Push index update
        working-directory: .temp/index
        run: |
          git add index.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update core to v${VERSION}"
            git push origin main
          fi
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/deploy_key

  deploy-docs:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract version from tag
        run: |
          VERSION="${{ github.ref_name }}"
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Generate Dokka docs
        run: ./gradlew :autotweaker-api:dokkaGenerate

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PAGES_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Clone pages repository
        run: git clone git@github.com:AutoTweaker/autotweaker.github.io.git .temp/pages
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/deploy_key

      - name: Configure git
        working-directory: .temp/pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs
        working-directory: .temp/pages
        run: |
          rm -rf doc
          mkdir doc
          cp -r ../../api/build/dokka/api/* doc/

      - name: Push
        working-directory: .temp/pages
        run: |
          git add doc
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update API docs for v${VERSION}"
            git push origin main
          fi
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/deploy_key
